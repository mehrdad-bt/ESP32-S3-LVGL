
; ESP8266 sender project (separate PlatformIO project from the S3).
; Put esp8266_main.cpp as src/main.cpp and copy the S3 firmware.bin to data/fw.bin
; Upload code:  pio run -t upload
; Upload file:  pio run -t uploadfs   (needed every time the S3 firmware changes)
 
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
 
board_build.filesystem = littlefs
; 4 MB flash: 2 MB for LittleFS. If fw.bin > ~1.9 MB use eagle.flash.4m3m.ld (3 MB FS)
board_build.ldscript = eagle.flash.4m2m.ld
 
upload_speed = 460800
monitor_speed = 115200
 