; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for other options and examples
; https://docs.platformio.org/page/projectconf.html


[env:4d_systems_esp32s3_gen4_r8n16]

platform = espressif32

board = 4d_systems_esp32s3_gen4_r8n16

framework = arduino


; ==================================================
; UPLOAD / MONITOR
; ==================================================

upload_speed = 115200

monitor_speed = 115200


; ==================================================
; USB
; ==================================================
;
; Keep the official board configuration:
;
;     USB CDC On Boot = Enabled
;     USB Mode        = Hardware CDC and JTAG
;
; Serial0 = UART0 -> onboard CH343 -> COM16
;
; Serial  = USB CDC
;
; We will explicitly use Serial0 for the
; debug/update communication through COM16.
;
; ==================================================

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1


; ==================================================
; LIBRARIES
; ==================================================

lib_deps =
    lvgl/lvgl@8.4.0
    bodmer/TFT_eSPI@^2.5.43